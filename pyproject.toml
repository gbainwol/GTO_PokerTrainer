[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gto-pokertrainer"
version = "0.1.0"
description = "Prototype CLI for a GTO poker training tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GTO PokerTrainer" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gto-pokertrainer = "gto_pokertrainer.cli:main"
